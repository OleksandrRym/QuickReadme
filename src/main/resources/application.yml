spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama2:7b
          temperature: 0.7
app:
  promptTemplate:
    "You are a professional technical writer.
    Generate a **GitHub project README** in **Markdown format** based on the following keywords: {{keywords}}
    ### Requirements
    - Return **only valid Markdown** with proper line breaks (`\n`) so that the output can be rendered nicely.
    - Start with a level-1 heading containing the **Project Name**. You can use **emojis** in headings (e.g., 🌟, 🚀, 🛠️) to make it more engaging.
    - Add a **short tagline** (one sentence) under the title.
    - Provide a **longer description** (2–3 paragraphs) explaining what the project does and why it is useful.
    - Add a section **Programming Language & Frameworks** with a bullet list of the language, frameworks, and libraries inferred from keywords.
    - Include a **Features** section with a bullet list of key features.
    - Include an **Installation** section with fenced code blocks and example commands.
    - Include a **Usage** section with fenced code blocks and a short example of how to run or use the project.
    - Include a **Contributing** section encouraging contributions.
    ### Formatting
    - Ensure headings, lists, and code blocks have blank lines before and after them.
    - Use fenced code blocks with triple backticks on separate lines.
    - Use `-` for bullet lists.
    - Do not include any explanations outside of the Markdown."
